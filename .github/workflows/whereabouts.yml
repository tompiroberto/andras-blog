# "Where am I now" on the maps: at the times in src/data/whereabouts.json the "now" country in
# src/data/countries.json is moved on (scripts/whereabouts.mjs) and the change is committed – Netlify
# then rebuilds the site. (The home page's pill switches by itself in the visitor's browser.)
# GitHub runs scheduled workflows in UTC and may start them a few minutes late.
name: Where am I now

on:
  schedule:
    - cron: '5 20 4 10 *'   # 4 Oct 2026, 23:05 Greek time
    - cron: '5 23 2 12 *'   # 3 Dec 2026, 00:05 Hungarian time
    - cron: '5 23 10 12 *'  # 11 Dec 2026, 00:05 Hungarian time
    - cron: '30 6 * * 1'    # and every Monday, in case one was missed
    - cron: '15 22 * * *'   # and every night (a trip of the calendar may start any day)
  workflow_dispatch:
  # a change made on the site (developer mode: a click on the "currently in" pill)
  push:
    paths:
      - src/data/whereabouts.json
      - src/data/calendar.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: run
        run: echo "result=$(node scripts/whereabouts.mjs)" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.result == 'changed'
        run: |
          git config user.name "whereabouts bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/countries.json src/data/site.json
          git commit -m "Where am I now: moved on (scheduled)"
          git push
