# Decap CMS (developer mode): new posts and photos become files in the repository.
# Online: log in with GitHub (free; Netlify's OAuth provider must be installed, README → "Developer mode").
# Only GitHub accounts with write access to the repository can publish.
# Locally: run `npx decap-server` next to `npm run dev`, then open http://localhost:4321/admin/
backend:
  name: github
  repo: tompiroberto/andras-blog
  branch: main
local_backend: true
locale: hu
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Bejegyzések
    label_singular: Bejegyzés
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    # pictures go next to the site's other images so Astro can optimise them
    media_folder: ../../assets/posts
    public_folder: ../../assets/posts
    fields:
      - { label: Cím, name: title, widget: string }
      - { label: Dátum, name: date, widget: datetime, required: false, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Dátum pontossága, name: datePrecision, widget: select, options: [day, month], default: day }
      - { label: Kategória, name: category, widget: select, options: [adventures, erasmus, random] }
      - { label: Nyelv, name: lang, widget: select, options: [en, hu, pt, ro, el, ka], default: hu }
      - { label: Rövid leírás (a kártyán), name: excerpt, widget: text }
      - { label: Borítókép, name: cover, widget: image, required: false }
      - { label: Borítókép leírása, name: coverAlt, widget: string, required: false }
      - { label: Ikon (Lucide név, pl. mountain), name: icon, widget: string, required: false }
      - { label: Országok (pl. HU, SK), name: countries, widget: list, required: false }
      - { label: Piszkozat (még nem jelenik meg), name: draft, widget: boolean, default: false }
      - { label: Szöveg, name: body, widget: markdown }

  - name: photos
    label: Fotók
    label_singular: Fotó
    folder: src/content/photos
    create: true
    extension: yml
    format: yml
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    identifier_field: caption
    media_folder: ../../assets/photos
    public_folder: ../../assets/photos
    fields:
      - { label: Fotó, name: image, widget: image }
      - { label: Képaláírás, name: caption, widget: string }
      - { label: Hely, name: place, widget: string, required: false }
      - { label: Dátum, name: date, widget: datetime, required: false, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
